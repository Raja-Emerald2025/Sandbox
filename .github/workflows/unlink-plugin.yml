name: Unlink plugin from dashboard

on:
  workflow_dispatch:
    inputs:
      plugin_id:
        description: "Plugin object id to unlink from the dashboard in .env"
        required: true

jobs:
  unlink:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: top20_products_gallery
    env:
      TIGER_API_TOKEN: ${{ secrets.TIGER_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Unlink plugin from dashboard
        run: npm run unlink-plugin -- "${{ github.event.inputs.plugin_id }}"
